[project]
name = "gdrive-duplicate"
version = "0.1.0"
description = "A FastAPI application with a GUI to find and delete duplicate files in Google Drive."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "google-api-python-client>=2.196.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.48.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pyinstaller>=6.4.0",
]
