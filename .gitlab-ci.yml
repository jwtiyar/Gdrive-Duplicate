stages:
  - build

build-windows-exe:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  image: python:3.11-windows
  tags:
    - saas-windows-medium-amd64
  script:
    - pip install uv
    - uv pip install --system fastapi google-api-python-client google-auth-httplib2 google-auth-oauthlib python-dotenv uvicorn pyinstaller httpx pytest
    - echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
    - echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env
    - pyinstaller --name DriveCleaner --icon=static/logo.ico --add-data "static;static" --add-data ".env;." --onefile main.py
    - mv dist/DriveCleaner.exe dist/DriveCleaner-Windows.exe
  artifacts:
    paths:
      - dist/DriveCleaner-Windows.exe
    expire_in: 1 week

build-linux-binaries:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  image: python:3.11-slim
  script:
    - apt-get update && apt-get install -y wget file binutils
    - pip install uv
    - uv pip install --system fastapi google-api-python-client google-auth-httplib2 google-auth-oauthlib python-dotenv uvicorn pyinstaller httpx pytest
    - echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
    - echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env
    - pyinstaller --name DriveCleaner --icon=static/logo.png --add-data "static:static" --add-data ".env:." --onefile main.py
    - mv dist/DriveCleaner dist/DriveCleaner-Linux
    
    # AppImage Creation
    - mkdir -p AppDir/usr/bin
    - cp dist/DriveCleaner-Linux AppDir/usr/bin/DriveCleaner
    - echo -e "[Desktop Entry]\nName=DriveCleaner\nExec=DriveCleaner\nIcon=DriveCleaner\nType=Application\nCategories=Utility;" > AppDir/DriveCleaner.desktop
    - echo -e '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "${HERE}/usr/bin/DriveCleaner" "$@"' > AppDir/AppRun
    - chmod +x AppDir/AppRun
    - cp static/logo.png AppDir/DriveCleaner.png
    - wget -q -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
    - chmod +x appimagetool
    - ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/DriveCleaner-x86_64.AppImage
  artifacts:
    paths:
      - dist/DriveCleaner-Linux
      - dist/DriveCleaner-x86_64.AppImage
    expire_in: 1 week
